<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de Sílabas con S para Niños (PWA)</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0EA5E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sílabas S">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5 overflow-x-hidden relative">

  <canvas id="confettiCanvas"></canvas>

  <header class="w-full max-w-4xl mx-auto flex justify-between items-center bg-white/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 shadow-xl border-4 border-white/80 z-10">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-sky-500 to-indigo-600 text-white rounded-xl p-2.5 shadow-md">
        <svg class="w-7 h-7 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-sky-950 leading-none">Sílabas con "S"</h1>
        <p class="text-xs sm:text-sm font-semibold text-sky-600 mt-1">Presiona la figura correcta</p>
      </div>
    </div>

    <!-- Audio Repeat Button -->
    <button id="speakTargetBtn" title="Escuchar sílaba de nuevo" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold p-3 sm:px-4 sm:py-3 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center gap-2 border-2 border-amber-300">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
      </svg>
      <span class="hidden sm:inline font-bold">Repetir</span>
    </button>
  </header>

  <main class="w-full max-w-4xl mx-auto my-auto flex flex-col items-center justify-center py-2 z-10">
    
    <!-- Target Syllable Display -->
    <div class="my-2 sm:my-3 text-center w-full">
      <div class="inline-block bg-white/95 backdrop-blur-md rounded-3xl px-10 sm:px-14 py-2 sm:py-4 shadow-2xl border-4 border-sky-300 transform transition-all">
        <span class="text-sky-400 text-xs sm:text-sm font-extrabold uppercase tracking-widest block mb-1">Busca la sílaba:</span>
        <div id="silaba" class="text-7xl sm:text-9xl font-black text-sky-600 tracking-wider animate-syllable drop-shadow-lg">
          SA
        </div>
      </div>
    </div>

    <!-- 5 Figure Options Grid -->
    <div id="figuras" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 sm:gap-5 w-full px-1 py-2">
      <!-- Cards dynamically generated via JavaScript -->
    </div>

    <!-- Audio / Visual Message Banner -->
    <div id="feedbackText" class="h-10 my-1 text-center font-black text-xl sm:text-2xl text-sky-950 transition-all duration-300 opacity-0">
      &nbsp;
    </div>

  </main>

  <footer class="w-full max-w-4xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 shadow-xl border-4 border-white/80 flex flex-col sm:flex-row justify-between items-center gap-3 z-10">
    
    <!-- Score Stats -->
    <div id="status" class="flex items-center justify-around w-full sm:w-auto gap-3 sm:gap-6">
      <div class="flex items-center gap-2 bg-emerald-100 border-2 border-emerald-300 px-4 py-2 rounded-2xl shadow-sm">
        <span class="text-2xl">🌟</span>
        <div>
          <span class="text-[10px] sm:text-xs text-emerald-800 block font-extrabold leading-none">Aciertos</span>
          <span id="aciertos" class="text-lg sm:text-xl font-black text-emerald-950">0</span>
        </div>
      </div>

      <div class="flex items-center gap-2 bg-rose-100 border-2 border-rose-300 px-4 py-2 rounded-2xl shadow-sm">
        <span class="text-2xl">❌</span>
        <div>
          <span class="text-[10px] sm:text-xs text-rose-800 block font-extrabold leading-none">Fallas</span>
          <span id="fallas" class="text-lg sm:text-xl font-black text-rose-950">0</span>
        </div>
      </div>

      <div class="flex items-center gap-2 bg-purple-100 border-2 border-purple-300 px-4 py-2 rounded-2xl shadow-sm">
        <span class="text-xs sm:text-sm text-purple-900 font-extrabold">Ronda: <span id="rondaNum">1</span>/20</span>
      </div>
    </div>

    <!-- Restart Button -->
    <button id="reiniciar" class="w-full sm:w-auto bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white font-extrabold py-3 px-8 rounded-2xl shadow-lg active:scale-95 transition transform flex items-center justify-center gap-2 border-2 border-sky-400">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
      <span>Reiniciar juego</span>
    </button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
